[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskdaemon"
version = "0.1.0"
description = "TaskDaemon handler SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["taskdaemon", "task", "queue", "handler"]

[project.urls]
Homepage = "https://github.com/taskdaemon/handlers"
