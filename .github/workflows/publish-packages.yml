name: Publish packages

"on":
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish
        type: choice
        options: [all, python, npm, rust, nuget, maven]
        required: true
      version:
        description: Package version to publish from its immutable release tag
        type: string
        default: 0.1.2
        required: true

permissions:
  contents: read

concurrency:
  group: package-publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - name: Validate immutable release source
        run: |
          python3 scripts/check_release.py "$RELEASE_VERSION"
          tagged=$(git rev-parse --verify "refs/tags/v$RELEASE_VERSION^{commit}")
          test "$(git rev-parse HEAD)" = "$tagged"

  python:
    needs: validate
    if: inputs.registry == 'all' || inputs.registry == 'python'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install build twine
      - run: python3 -m unittest discover -s python/tests -v
      - run: python3 -m build python --outdir python/dist
      - run: python3 -m twine check python/dist/*
      - run: python3 python/tests/check_artifacts.py --version "$RELEASE_VERSION" python/dist/*
      - name: Publish using PyPI trusted publisher
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python/dist/
      - name: Publish using configured PyPI token
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    needs: validate
    if: inputs.registry == 'all' || inputs.registry == 'npm'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm test
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - run: node scripts/check-artifact.cjs "artifacts/taskdaemon-handler-$RELEASE_VERSION.tgz"
      - name: Publish public npm package
        run: npm publish "./artifacts/taskdaemon-handler-$RELEASE_VERSION.tgz" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  rust:
    needs: validate
    if: inputs.registry == 'all' || inputs.registry == 'rust'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/v${{ inputs.version }}
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo package --manifest-path rust/Cargo.toml --locked
      - name: Authenticate using crates.io trusted publisher
        if: env.CRATES_IO_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish using crates.io trusted publisher
        if: env.CRATES_IO_TOKEN == ''
        run: cargo publish --manifest-path rust/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish using configured crates.io token
        if: env.CRATES_IO_TOKEN != ''
        run: cargo publish --manifest-path rust/Cargo.toml --locked

  nuget:
    needs: validate
    if: inputs.registry == 'all' || inputs.registry == 'nuget'
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project csharp/tests/ProtocolSmoke/ProtocolSmoke.csproj --configuration Release
      - run: dotnet pack csharp/TaskDaemon/TaskDaemon.Handler.csproj --configuration Release --output csharp/artifacts
      - run: python3 csharp/tests/check_package.py "csharp/artifacts/TaskDaemon.Handler.$RELEASE_VERSION.nupkg"
      - name: Check NuGet account configuration
        run: |
          if [[ -z "$NUGET_API_KEY" && -z "$NUGET_USER" ]]; then
            echo 'Configure NUGET_USER and its trusted publisher policy, or set NUGET_API_KEY.' >&2
            exit 1
          fi
      - name: Authenticate using NuGet trusted publisher
        if: env.NUGET_API_KEY == ''
        id: auth
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish using NuGet trusted publisher
        if: env.NUGET_API_KEY == ''
        run: dotnet nuget push "csharp/artifacts/TaskDaemon.Handler.$RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_TEMP_KEY"
        env:
          NUGET_TEMP_KEY: ${{ steps.auth.outputs.NUGET_API_KEY }}
      - name: Publish using configured NuGet key
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "csharp/artifacts/TaskDaemon.Handler.$RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"

  maven:
    needs: validate
    if: inputs.registry == 'all' || inputs.registry == 'maven'
    runs-on: ubuntu-24.04
    environment: maven-central
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Check Central account and signing configuration
        run: |
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD MAVEN_GPG_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name; configure Maven Central publishing before running this job." >&2
              exit 1
            fi
          done
      - name: Sign and publish to Maven Central
        run: mvn --batch-mode --file java/pom.xml -Pcentral -Dcentral.autoPublish=true -DwaitUntil=published deploy
