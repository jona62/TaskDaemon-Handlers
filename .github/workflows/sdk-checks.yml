name: SDK checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_VERSION: 0.1.2

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 scripts/check_release.py "$SDK_VERSION"

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Test protocol and large requests
        working-directory: go
        run: go test -race ./...
      - name: Vet SDK
        working-directory: go
        run: go vet ./...

  csharp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build SDK
        run: dotnet build csharp/TaskDaemon/TaskDaemon.Handler.csproj --configuration Release
      - name: Verify stdio protocol
        run: dotnet run --project csharp/tests/ProtocolSmoke/ProtocolSmoke.csproj --configuration Release
      - name: Check local package creation
        run: dotnet pack csharp/TaskDaemon/TaskDaemon.Handler.csproj --configuration Release --no-build --output csharp/artifacts
      - name: Verify installed NuGet package
        run: python3 csharp/tests/check_package.py "csharp/artifacts/TaskDaemon.Handler.$SDK_VERSION.nupkg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: csharp/artifacts/*.nupkg
          if-no-files-found: error

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install build twine
      - run: python3 -m unittest discover -s python/tests -v
      - run: python3 -m build python --outdir python/dist
      - run: python3 -m twine check python/dist/*
      - run: python3 python/tests/check_artifacts.py --version "$SDK_VERSION" python/dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-packages
          path: python/dist/*
          if-no-files-found: error

  npm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm test
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - run: node scripts/check-artifact.cjs "artifacts/taskdaemon-handler-$SDK_VERSION.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: nodejs/artifacts/*.tgz
          if-no-files-found: error

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo build --manifest-path rust/Cargo.toml --example echo
      - run: cargo package --manifest-path rust/Cargo.toml --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-package
          path: rust/target/package/*.crate
          if-no-files-found: error

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode --file java/pom.xml clean verify
      - run: mvn --batch-mode --file java/pom.xml -Pcentral -Dgpg.skip=true verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-packages
          path: java/target/handler-*.jar
          if-no-files-found: error

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - run: cmake -S cpp -B build/cpp -DTASKDAEMON_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX="$PWD/install"
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: cmake --install build/cpp
      - run: cmake -S cpp/tests/package-consumer -B build/consumer -DCMAKE_PREFIX_PATH="$PWD/install"
      - run: cmake --build build/consumer
      - run: ctest --test-dir build/consumer --output-on-failure
      - run: cpack --config build/cpp/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpp-package
          path: build/packages/*.tar.gz
          if-no-files-found: error
