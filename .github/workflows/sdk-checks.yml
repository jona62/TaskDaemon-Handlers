name: SDK checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Test protocol and large requests
        working-directory: go
        run: go test -race ./...
      - name: Vet SDK
        working-directory: go
        run: go vet ./...

  csharp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build SDK
        run: dotnet build csharp/TaskDaemon/TaskDaemon.Handler.csproj --configuration Release
      - name: Verify stdio protocol
        run: dotnet run --project csharp/tests/ProtocolSmoke/ProtocolSmoke.csproj --configuration Release
      - name: Check local package creation
        run: dotnet pack csharp/TaskDaemon/TaskDaemon.Handler.csproj --configuration Release --no-build --output csharp/artifacts
